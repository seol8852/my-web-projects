<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우사기의 무한 토벌 서바이벌 타워 - 인피니티 레이드</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="tower.css">
</head>
<body>

  <!-- 상단 표준 통합 헤더 -->
  <header class="top-nav">
    <div class="nav-container">
      <div class="brand-logo">
        <span class="logo-emoji">🌸</span>
        <span class="logo-title">먼작귀 월드</span>
      </div>
      <nav class="nav-links">
        <a href="index.html" class="nav-link"><i class="fa-solid fa-house"></i> 홈</a>
        <a href="training.html" class="nav-link"><i class="fa-solid fa-dumbbell"></i> 훈련소</a>
        <a href="battle.html" class="nav-link"><i class="fa-solid fa-skull-crossbones"></i> 토벌전</a>
        <a href="tower.html" class="nav-link active"><i class="fa-solid fa-tower-observation"></i> 무한 타워</a>
        <a href="roulette.html" class="nav-link"><i class="fa-solid fa-clover"></i> 모몽가 룰렛</a>
        <a href="myroom.html" class="nav-link"><i class="fa-solid fa-shirt"></i> 마이룸</a>
        <a href="kurimanju.html" class="nav-link"><i class="fa-solid fa-utensils"></i> 야시장</a>
        <a href="ramen.html" class="nav-link"><i class="fa-solid fa-bowl-food"></i> 로우 라멘</a>
        <a href="achievements.html" class="nav-link"><i class="fa-solid fa-award"></i> 업적</a>
        <a href="index_monsters.html" class="nav-link"><i class="fa-solid fa-dragon"></i> 괴물 모드</a>
      </nav>
      <div class="nav-actions">
        <div class="acorn-display" id="navAcornDisplay">
          <span class="acorn-icon">🌰</span>
          <span class="acorn-val" id="navAcorns">300</span>
        </div>
        <button class="btn btn-sound" id="soundToggleBtn">
          <i class="fa-solid fa-volume-high" id="soundIcon"></i>
          <span id="soundText">효과음 ON</span>
        </button>
      </div>
    </div>
  </header>

  <main class="tower-main-container">
    <div class="tower-arena" style="background-image: url('assets/tower_bg.jpg');">
      <div class="tower-overlay">
        
        <!-- 타워 상단 헤더 -->
        <div class="tower-top-header">
          <div class="tower-floor-box">
            <span class="tower-floor-badge" id="currentFloorBadge">TOWER 1F</span>
            <span class="best-floor-pill">👑 최고 기록: <strong id="bestFloorText">1</strong>층</span>
          </div>
          <div class="tower-streak-box">
            <span class="tower-streak-info"><i class="fa-solid fa-fire"></i> 연속 처치: <strong id="killStreak">0</strong></span>
          </div>
        </div>

        <!-- 몬스터 상태 카드 (HP 바 & 장전 카운트다운 바) -->
        <div class="tower-enemy-card">
          <div class="tower-enemy-header">
            <div class="tower-enemy-title-wrap">
              <span class="tower-enemy-tag" id="towerEnemyTag">1F 수호 몬스터</span>
              <h3 class="tower-enemy-name" id="towerEnemyName">어둠의 탑 박쥐</h3>
            </div>
            <div class="tower-enemy-hp-text">
              HP <strong id="towerEnemyHpCur">200</strong> / <span id="towerEnemyHpMax">200</span>
            </div>
          </div>
          
          <!-- 몬스터 HP 게이지 -->
          <div class="tower-hp-bar-track">
            <div class="tower-hp-bar-fill" id="towerEnemyHpBar" style="width: 100%;"></div>
          </div>

          <!-- 몬스터 공격 장전 게이지 -->
          <div class="tower-charge-wrap">
            <span class="charge-label"><i class="fa-solid fa-triangle-exclamation"></i> 공격 장전</span>
            <div class="tower-charge-track">
              <div class="tower-charge-fill" id="towerEnemyChargeBar" style="width: 0%;"></div>
            </div>
          </div>
        </div>

        <!-- 전투 비주얼 필드 (우사기 vs 몬스터) -->
        <div class="tower-visual-field" id="towerVisualField">
          <!-- 우사기 플레이어 -->
          <div class="tower-player-wrap" id="towerPlayerWrap">
            <div class="tower-avatar-frame" id="towerAvatarFrame">
              <img src="assets/usagi.png" alt="우사기" class="tower-player-img" id="towerPlayerImg">
              <div class="tower-player-weapon" id="towerPlayerWeapon">🪄</div>
            </div>
            <div class="tower-guard-shield hidden" id="towerGuardShield">🛡️ GUARD!</div>
            <div class="tower-player-speech" id="towerPlayerSpeech">“우라라라-!! 어디까지 올라갈 수 있나 보자구!!”</div>
          </div>

          <div class="tower-vs-chip">VS</div>

          <!-- 몬스터 -->
          <div class="tower-enemy-wrap" id="towerEnemyWrap">
            <div class="tower-enemy-icon-box" id="towerEnemyIconBox">
              <div class="tower-enemy-icon" id="towerEnemyIcon">🦇</div>
            </div>
          </div>
        </div>

        <!-- 플레이어 상태창 & 액션 컨트롤러 -->
        <div class="tower-controls-card">
          <div class="tower-player-status-row">
            <div class="tower-player-hp-info">
              <div class="tower-hp-labels">
                <span>❤️ 내 체력</span>
                <span><strong id="towerPlayerHpCur">200</strong> / <span id="towerPlayerHpMax">200</span></span>
              </div>
              <div class="tower-player-hp-track">
                <div class="tower-player-hp-fill" id="towerPlayerHpBar" style="width: 100%;"></div>
              </div>
            </div>
            
            <div class="tower-stat-chips">
              <span class="stat-chip"><i class="fa-solid fa-fire"></i> 공격력 <strong id="myTowerAtkVal">25</strong></span>
            </div>
          </div>

          <!-- 3대 액션 커맨드 -->
          <div class="tower-action-buttons">
            <button class="btn-tower-act btn-tower-atk" id="btnTowerAtk" onclick="towerAttack(event)">
              <div class="btn-act-icon">⚔️</div>
              <div class="btn-act-text">
                <strong>우사기 야하-! 급습</strong>
                <span>클릭 / Space</span>
              </div>
            </button>
            <button class="btn-tower-act btn-tower-guard" id="btnTowerGuard" onclick="towerGuard()">
              <div class="btn-act-icon">🛡️</div>
              <div class="btn-act-text">
                <strong>저스트 패링 방어</strong>
                <span id="towerGuardStatusText">공격 타이밍에 (G)</span>
              </div>
            </button>
            <button class="btn-tower-act btn-tower-heal" id="btnTowerHeal" onclick="towerHeal()">
              <div class="btn-act-icon">🥕</div>
              <div class="btn-act-text">
                <strong>우사기 특제 당근 (H)</strong>
                <span id="towerHealDesc">HP 35% 즉시 회복</span>
              </div>
              <div class="tower-heal-cd-overlay hidden" id="towerHealCd">10s</div>
            </button>
          </div>
        </div>

      </div>
    </div>
  </main>

  <!-- 게임 오버 모달 -->
  <div class="modal-backdrop hidden" id="towerGameOverModal">
    <div class="modal-card tower-over-card">
      <div class="tower-over-icon">💀</div>
      <h2 class="tower-over-title">서바이벌 타워 종료!</h2>
      <p class="tower-over-desc">우사기 원정대의 체력이 모두 소진되었습니다.</p>
      
      <div class="tower-record-highlight">
        <div class="rec-item">
          <span>최종 도달 층수:</span>
          <strong id="finalFloorText" style="color:#FFE066; font-size:1.9rem;">1 층</strong>
        </div>
        <div class="rec-item">
          <span>총 획득 도토리:</span>
          <strong id="towerEarnedAcorns" style="color:#FFA94D; font-size:1.3rem;">+0 🌰</strong>
        </div>
      </div>

      <div class="modal-btn-row">
        <button class="btn btn-secondary" onclick="window.location.href='index.html'">홈으로</button>
        <button class="btn btn-primary" onclick="restartTower()">다시 1층부터 진격 🚀 (Space)</button>
      </div>
    </div>
  </div>

  <div class="toast-popup" id="toastPopup">토스트 메시지</div>

  <script src="tower.js"></script>
  <script src="audio_player.js"></script>
</body>
</html>
