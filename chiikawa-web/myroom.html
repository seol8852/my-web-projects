<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>치이카와 & 하치와레의 동굴 마이룸 & 코스튬 옷장</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="myroom.css">
</head>
<body>

  <!-- 상단 네비게이션 -->
    <!-- 표준 통합 네비게이션 헤더 -->
    <!-- 표준 통합 8대 메뉴 헤더 -->
  <header class="top-nav">
    <div class="nav-container">
      <div class="brand-logo">
        <span class="logo-emoji">🌸</span>
        <span class="logo-title">먼작귀 월드</span>
      </div>
            <nav class="nav-links">
        <a href="index.html" class="nav-link "><i class="fa-solid fa-house"></i> 홈</a>
        <a href="training.html" class="nav-link "><i class="fa-solid fa-dumbbell"></i> 훈련소</a>
        <a href="battle.html" class="nav-link "><i class="fa-solid fa-skull-crossbones"></i> 토벌전</a>
        <a href="tower.html" class="nav-link "><i class="fa-solid fa-tower-observation"></i> 무한 타워</a>
        <a href="roulette.html" class="nav-link "><i class="fa-solid fa-clover"></i> 모몽가 룰렛</a>
        <a href="myroom.html" class="nav-link active"><i class="fa-solid fa-shirt"></i> 마이룸</a>
        <a href="kurimanju.html" class="nav-link "><i class="fa-solid fa-utensils"></i> 야시장</a>
        <a href="ramen.html" class="nav-link "><i class="fa-solid fa-bowl-food"></i> 로우 라멘</a>
        <a href="achievements.html" class="nav-link "><i class="fa-solid fa-award"></i> 업적</a>
        <a href="index_monsters.html" class="nav-link "><i class="fa-solid fa-dragon"></i> 괴물 모드</a>
      </nav>
      <div class="nav-actions">
        <button class="btn btn-sound" id="soundToggleBtn">
          <i class="fa-solid fa-volume-high" id="soundIcon"></i>
          <span id="soundText">효과음 ON</span>
        </button>
      </div>
    </div>
  </header>

  <!-- 탭 내비게이션 -->
  <div class="myroom-tab-bar">
    <button class="tab-btn active" id="btnTabRoom" onclick="switchMyRoomTab('room')">
      <i class="fa-solid fa-couch"></i> 🏠 동굴 방 꾸미기 (인테리어)
    </button>
    <button class="tab-btn" id="btnTabWardrobe" onclick="switchMyRoomTab('wardrobe')">
      <i class="fa-solid fa-shirt"></i> 👗 파자마 & 코스튬 옷장
    </button>
  </div>

  <!-- TAB 1: 동굴 방 꾸미기 인터페이스 -->
  <main class="myroom-container active" id="tabContentRoom">
    <div class="cave-room-viewport" id="caveRoomViewport" style="background-image: url('assets/myroom_bg.jpg');">
      <div class="room-decorations-layer" id="roomDecorationsLayer">
        <!-- 배치된 가구 아이템들이 동적으로 렌더링 -->
      </div>
      <div class="room-characters-layer">
        <div class="room-char-wrap" id="roomCharWrap">
          <img src="assets/chiikawa.png" alt="치이카와" class="room-char-img" id="roomCharImg">
          <div class="room-char-speech" id="roomCharSpeech">“우리 동굴 방이 점점 예뻐지고 있어...!”</div>
        </div>
      </div>
    </div>

    <!-- 가구 인테리어 상점 / 배치 카탈로그 -->
    <section class="furniture-catalog-section">
      <div class="catalog-header">
        <h3>🛋️ 동굴 인테리어 가구 카탈로그</h3>
        <p>미니게임과 훈련으로 모은 도토리(🌰)로 방을 꾸미고 배치하세요!</p>
      </div>
      <div class="furniture-grid" id="furnitureGrid"></div>
    </section>
  </main>

  <!-- TAB 2: 파자마 & 코스튬 옷장 -->
  <main class="myroom-container hidden" id="tabContentWardrobe">
    <div class="wardrobe-section">
      <div class="wardrobe-header">
        <h2>👗 먼작귀 파자마 & 코스튬 드레스룸</h2>
        <p>업적을 달성해 코스튬을 해금하고, 모든 페이지의 캐릭터 외형을 갈아입혀보세요!</p>
      </div>

      <div class="wardrobe-preview-card">
        <div class="wardrobe-preview-avatar">
          <img src="assets/chiikawa.png" alt="착용 프리뷰" id="wardrobePreviewImg">
        </div>
        <div class="wardrobe-preview-info">
          <div class="equipped-badge">현재 장착 중</div>
          <h3 id="equippedSkinName">🌸 클래식 오리지널</h3>
          <p id="equippedSkinDesc">언제나 귀엽고 사랑스러운 치이카와의 기본 모습입니다.</p>
        </div>
      </div>

      <div class="costumes-grid" id="costumesGrid"></div>
    </div>
  </main>

  <div class="toast-popup" id="toastPopup">토스트 메시지</div>

  <script src="audio_player.js"></script>
  <script src="myroom.js"></script>
</body>
</html>
