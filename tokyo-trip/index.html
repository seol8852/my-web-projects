<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>설범준의 도쿄 시티 투어 | 5일간 79개 스팟 인터랙티브 맵 & 하치와레 시뮬레이터</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800;900&family=Cinzel:wght@700;800;900&family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #070a14;
      --sidebar-bg: rgba(11, 16, 28, 0.92);
      --panel-bg: rgba(16, 23, 40, 0.72);
      --panel-hover: rgba(24, 34, 58, 0.88);
      --glass-border: rgba(255, 255, 255, 0.08);
      --accent-cyan: #38bdf8;
      --accent-blue: #3b82f6;
      --accent-pink: #ec4899;
      --accent-purple: #a855f7;
      --accent-amber: #f59e0b;
      --accent-emerald: #10b981;
      --accent-red: #ef4444;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --ease-spring: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', -apple-system, sans-serif; }
    body { display: flex; height: 100vh; overflow: hidden; background: var(--bg-base); color: var(--text-main); }

    /* Micro Scrollbar */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.3); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(56, 189, 248, 0.6); }

    /* Sidebar */
    #sidebar {
      width: 500px;
      min-width: 500px;
      height: 100%;
      min-height: 0;
      background: var(--sidebar-bg);
      backdrop-filter: blur(32px) saturate(180%);
      -webkit-backdrop-filter: blur(32px) saturate(180%);
      border-right: 1px solid var(--glass-border);
      display: flex;
      flex-direction: column;
      z-index: 1000;
      position: relative;
      transition: margin-left 0.35s var(--ease-spring);
      box-shadow: 20px 0 60px rgba(0, 0, 0, 0.85);
    }

    #sidebar.collapsed {
      margin-left: -500px;
    }

    .sidebar-toggle {
      position: absolute;
      top: 22px;
      right: -42px;
      width: 42px;
      height: 48px;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-left: none;
      border-radius: 0 12px 12px 0;
      color: var(--accent-cyan);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 2000;
      box-shadow: 6px 0 20px rgba(0, 0, 0, 0.6);
      font-size: 15px;
      font-weight: 800;
      transition: all 0.2s var(--ease-spring);
    }
    .sidebar-toggle:hover {
      background: #0284c7;
      color: #fff;
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.6);
      width: 46px;
      right: -46px;
    }

    /* Brand Header */
    .brand {
      padding: 16px 20px 12px 20px;
      background: linear-gradient(180deg, rgba(25, 36, 62, 0.75) 0%, rgba(12, 18, 32, 0.95) 100%);
      border-bottom: 1px solid var(--glass-border);
      flex-shrink: 0;
    }
    .brand-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(236, 72, 153, 0.15);
      border: 1px solid rgba(236, 72, 153, 0.35);
      padding: 3px 9px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 700;
      color: #f472b6;
      letter-spacing: 0.05em;
    }
    .brand-hub-link {
      font-size: 11px;
      color: var(--accent-cyan);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 6px;
      transition: all 0.2s;
    }
    .brand-hub-link:hover {
      background: #0284c7;
      color: #fff;
    }
    .brand h1 {
      font-size: 19px;
      font-weight: 900;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: -0.02em;
    }
    .brand-meta {
      display: flex;
      gap: 14px;
      margin-top: 8px;
      font-size: 11.5px;
      color: var(--text-sub);
    }
    .brand-meta-item strong {
      color: var(--accent-cyan);
      font-family: 'JetBrains Mono', monospace;
    }

    /* Day Navigation Tabs */
    .day-tabs {
      display: flex;
      padding: 10px 16px;
      gap: 6px;
      background: rgba(15, 23, 42, 0.6);
      border-bottom: 1px solid var(--glass-border);
      flex-shrink: 0;
    }
    .day-tab-btn {
      flex: 1;
      padding: 8px 6px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--glass-border);
      border-radius: 9px;
      color: var(--text-sub);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s var(--ease-spring);
      white-space: nowrap;
    }
    .day-tab-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }
    .day-tab-btn.active {
      background: linear-gradient(135deg, #ec4899 0%, #db2777 100%);
      color: #fff;
      border-color: #f472b6;
      box-shadow: 0 4px 14px rgba(236, 72, 153, 0.4);
    }

    /* Day Route Overview Card */
    .day-overview-card {
      margin: 12px 16px 6px 16px;
      padding: 12px 14px;
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.8) 0%, rgba(15, 23, 42, 0.95) 100%);
      border: 1px solid rgba(236, 72, 153, 0.25);
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      flex-shrink: 0;
    }
    .doc-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 5px;
    }
    .doc-badge {
      font-size: 11px;
      font-weight: 800;
      color: #f472b6;
      letter-spacing: 0.04em;
    }
    .doc-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .doc-count {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 800;
      color: var(--accent-cyan);
      background: rgba(56, 189, 248, 0.12);
      padding: 2px 8px;
      border-radius: 6px;
      border: 1px solid rgba(56, 189, 248, 0.25);
    }
    .doc-play-btn {
      padding: 3px 9px;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      border: 1px solid #38bdf8;
      border-radius: 6px;
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }
    .doc-play-btn:hover {
      background: #0ea5e9;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.5);
    }
    .doc-title {
      font-size: 13.5px;
      font-weight: 800;
      color: #fff;
      line-height: 1.35;
      margin-bottom: 4px;
    }
    .doc-route {
      font-size: 11.5px;
      color: #94a3b8;
      line-height: 1.4;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Filter Bar */
    .filter-bar {
      display: flex;
      padding: 8px 16px;
      gap: 6px;
      border-bottom: 1px solid var(--glass-border);
      overflow-x: auto;
      background: rgba(12, 18, 32, 0.4);
      flex-shrink: 0;
    }
    .filter-bar::-webkit-scrollbar { display: none; }
    .filter-pill {
      padding: 5px 11px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--glass-border);
      color: var(--text-sub);
      font-size: 11px;
      font-weight: 600;
      border-radius: 9999px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .filter-pill:hover { color: #fff; background: rgba(255, 255, 255, 0.1); }
    .filter-pill.active {
      background: #0284c7;
      color: #fff;
      border-color: #38bdf8;
      box-shadow: 0 2px 8px rgba(56, 189, 248, 0.3);
    }

    /* Spot List Container */
    .spot-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 12px 16px 90px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Spot Card */
    .spot-card {
      background: var(--panel-bg);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 12px 14px;
      transition: all 0.25s var(--ease-spring);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .spot-card:hover {
      transform: translateX(3px);
      border-color: rgba(56, 189, 248, 0.4);
      background: var(--panel-hover);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }
    .spot-card.selected {
      border-color: #f472b6;
      box-shadow: 0 0 18px rgba(236, 72, 153, 0.45);
      background: rgba(30, 41, 65, 0.95);
    }
    .spot-card.sim-active {
      border-color: #38bdf8 !important;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.6) !important;
      background: rgba(14, 165, 233, 0.18) !important;
    }

    .spot-card-top {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .spot-num-badge {
      width: 26px;
      height: 26px;
      min-width: 26px;
      border-radius: 50%;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: var(--accent-cyan);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .spot-names {
      flex: 1;
      min-width: 0;
    }
    .spot-name-ko {
      font-size: 13.5px;
      font-weight: 800;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.3;
    }
    .spot-name-en {
      font-size: 11px;
      color: var(--text-sub);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }
    .spot-badges {
      display: flex;
      gap: 5px;
      align-items: center;
      flex-shrink: 0;
    }
    .spot-day-pill {
      font-size: 10px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid;
      font-family: 'JetBrains Mono', monospace;
      white-space: nowrap;
    }
    .spot-cat-pill {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-sub);
      border: 1px solid var(--glass-border);
      white-space: nowrap;
    }

    .spot-memo-box {
      padding: 8px 11px;
      background: rgba(56, 189, 248, 0.08);
      border-left: 3px solid #38bdf8;
      border-radius: 0 8px 8px 0;
      font-size: 11.5px;
      color: #bae6fd;
      line-height: 1.45;
      word-break: keep-all;
    }

    .spot-photo {
      width: 100%;
      height: 120px;
      object-fit: cover;
      display: block;
      border-radius: 8px;
      margin-top: 2px;
    }

    /* Map */
    #map {
      flex: 1;
      height: 100%;
      position: relative;
    }

    /* Map Layer Switcher (USA Roadtrip Style: Left Top next to sidebar) */
    .layer-selector {
      position: absolute;
      top: 20px;
      left: 530px;
      z-index: 1000;
      display: flex;
      background: rgba(12, 18, 32, 0.92);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid var(--glass-border);
      box-shadow: 0 10px 32px rgba(0, 0, 0, 0.7);
      transition: left 0.35s var(--ease-spring);
      gap: 4px;
    }
    .layer-btn {
      padding: 7px 14px;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-sub);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.2s var(--ease-spring);
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .layer-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.12);
    }
    .layer-btn.active {
      background: #0284c7;
      color: #fff;
      border-color: #38bdf8;
      box-shadow: 0 2px 10px rgba(56, 189, 248, 0.45);
    }

    /* ================= HACHIWARE SIMULATOR BOTTOM BAR ================= */
    .hachi-sim-bar {
      position: absolute;
      bottom: 24px;
      left: 530px;
      right: 24px;
      z-index: 1000;
      background: rgba(11, 16, 28, 0.92);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 16px;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(56, 189, 248, 0.15);
      transition: left 0.35s var(--ease-spring);
    }

    .hachi-sim-left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .hachi-play-btn {
      padding: 8px 16px;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      border: 1px solid #38bdf8;
      border-radius: 10px;
      color: #fff;
      font-size: 12.5px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
      white-space: nowrap;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4);
    }
    .hachi-play-btn:hover {
      background: #0ea5e9;
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.6);
      transform: translateY(-1px);
    }
    .hachi-play-btn.playing {
      background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
      border-color: #f87171;
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
    }

    .hachi-ctrl-btn {
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      border-radius: 9px;
      color: var(--text-sub);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .hachi-ctrl-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    .hachi-speed-group {
      display: flex;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--glass-border);
      border-radius: 8px;
      padding: 2px;
      gap: 2px;
    }
    .hachi-spd-btn {
      padding: 4px 8px;
      background: transparent;
      border: none;
      color: var(--text-sub);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      border-radius: 6px;
      font-family: 'JetBrains Mono', monospace;
      transition: all 0.2s;
    }
    .hachi-spd-btn.active {
      background: #0284c7;
      color: #fff;
      box-shadow: 0 2px 6px rgba(56, 189, 248, 0.35);
    }

    .hachi-sim-center {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .hachi-sim-info {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow: hidden;
    }
    .hachi-sim-tag {
      font-size: 11px;
      font-weight: 800;
      font-family: 'JetBrains Mono', monospace;
      color: #f472b6;
      background: rgba(236, 72, 153, 0.15);
      border: 1px solid rgba(236, 72, 153, 0.3);
      padding: 2px 7px;
      border-radius: 5px;
      white-space: nowrap;
    }
    .hachi-sim-status {
      font-size: 12px;
      color: #bae6fd;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .hachi-slider {
      -webkit-appearance: none;
      width: 100%;
      height: 5px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.1);
      outline: none;
      cursor: pointer;
      accent-color: #38bdf8;
    }
    .hachi-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #38bdf8;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.8);
    }

    .hachi-sim-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .hachi-toggle-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-sub);
      cursor: pointer;
      white-space: nowrap;
      user-select: none;
    }
    .hachi-toggle-label input {
      accent-color: #38bdf8;
      cursor: pointer;
    }
    .hachi-voice-btn {
      padding: 6px 11px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      border-radius: 8px;
      color: var(--text-sub);
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .hachi-voice-btn.active {
      background: rgba(16, 185, 129, 0.2);
      border-color: #10b981;
      color: #34d399;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.4);
    }

    /* ================= HACHIWARE MAP MARKER ================= */
    .hachiware-marker-container {
      position: relative;
      width: 64px;
      height: 64px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      pointer-events: auto;
    }
    .hachi-bubble {
      position: absolute;
      bottom: 66px;
      background: rgba(11, 16, 28, 0.95);
      color: #38bdf8;
      border: 1.5px solid #38bdf8;
      border-radius: 12px;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
      box-shadow: 0 4px 14px rgba(56, 189, 248, 0.4);
      pointer-events: none;
      transition: all 0.2s;
      z-index: 10000;
    }
    .hachi-bubble::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border-width: 5px;
      border-style: solid;
      border-color: #38bdf8 transparent transparent transparent;
    }
    .hachi-character-box {
      width: 54px;
      height: 54px;
      transition: transform 0.15s ease-out;
      transform-origin: center bottom;
    }
    .hachi-character-box.walking {
      animation: hachiWaddle 0.32s infinite alternate ease-in-out;
    }
    @keyframes hachiWaddle {
      0% { transform: translateY(0) rotate(-6deg); }
      100% { transform: translateY(-7px) rotate(6deg); }
    }
    .hachi-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.7));
    }
    .hachi-shadow {
      position: absolute;
      bottom: 2px;
      width: 32px;
      height: 8px;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 50%;
      filter: blur(2px);
    }

    /* Leaflet Custom Marker Icons */
    .custom-spot-marker {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      border: 2px solid #fff;
      box-shadow: 0 0 12px rgba(0, 0, 0, 0.6), 0 0 16px rgba(56, 189, 248, 0.5);
      color: #fff;
      font-weight: 900;
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .custom-spot-marker:hover {
      transform: scale(1.3);
      z-index: 9999 !important;
    }

    /* Leaflet Popups */
    .leaflet-popup-content-wrapper {
      background: rgba(11, 16, 28, 0.96) !important;
      backdrop-filter: blur(24px) !important;
      border: 1px solid var(--glass-border) !important;
      border-radius: 12px !important;
      color: #fff !important;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.8) !important;
      padding: 0 !important;
      overflow: hidden;
    }
    .leaflet-popup-content {
      margin: 14px 16px !important;
      line-height: 1.4 !important;
    }
    .leaflet-popup-tip {
      background: rgba(11, 16, 28, 0.96) !important;
    }
    .popup-title {
      font-size: 14px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 2px;
    }
    .popup-sub {

    // Build interpolated path for simulation
    function buildSimPath() {
      simPath = [];
      simSegments = [];
      if (simSpots.length === 0) return;

      if (simSpots.length === 1) {
        simPath.push([simSpots[0].lat, simSpots[0].lng]);
        simSegments.push(simSpots[0]);
        return;
      }

      for (let i = 0; i < simSpots.length - 1; i++) {
        const spA = simSpots[i];
        const spB = simSpots[i + 1];
        const latA = spA.lat, lngA = spA.lng;
        const latB = spB.lat, lngB = spB.lng;

        // Calculate approximate distance for smooth speed
        const dist = Math.hypot(latB - latA, lngB - lngA);
        const steps = Math.max(30, Math.min(120, Math.round(dist * 600)));

        for (let s = 0; s < steps; s++) {
          const t = s / steps;
          simPath.push([
            latA + (latB - latA) * t,
            lngA + (lngB - lngA) * t
          ]);
          simSegments.push(t < 0.5 ? spA : spB);
        }
      }
      // Add final point
      const last = simSpots[simSpots.length - 1];
      simPath.push([last.lat, last.lng]);
      simSegments.push(last);
    }

    function initHachiware() {
      if (simPath.length === 0) return;
      const startPt = simPath[0];

      if (!hachiMarker) {
        hachiMarker = L.marker(startPt, { icon: hachiIcon, zIndexOffset: 9999 }).addTo(map);
      } else {
        hachiMarker.setLatLng(startPt);
      }

      if (!hachiTrail) {
        hachiTrail = L.polyline([startPt], {
          color: '#38bdf8',
          weight: 5,
          opacity: 0.8,
          dashArray: '6, 8'
        }).addTo(map);
      } else {
        hachiTrail.setLatLngs([startPt]);
      }

      updateSimFrame(0);
    }

      } else {
        btn.textContent = '▶ 하치와레 투어 시작';

    function setHachiSpeed(spd, btn) {
      simSpeed = parseFloat(spd);
      document.querySelectorAll('.hachi-spd-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    function onHachiScrub(val) {
      simProgress = parseFloat(val) / 1000;

    }

    function runSimLoop() {
      if (!isSimPlaying) return;

      // Increment progress based on speed
      const totalSteps = simPath.length;
      const stepInc = (1 / totalSteps) * simSpeed * 1.5;
      simProgress += stepInc;

      if (simProgress >= 1.0) {
        simProgress = 1.0;
        updateSimFrame(1.0);
        toggleHachiSim();
        const bubble = document.getElementById('hachiBubble');
        if (bubble) bubble.textContent = '🎉 오늘 투어 완주 성공이다냥! 참 잘했어요!';
        speakText('오늘의 투어를 모두 완주했습니다! 정말 즐거웠어요!');
        return;

      updateSimFrame(simProgress);
      simTimer = setTimeout(runSimLoop, 35);
    }

    function updateSimFrame(prog) {
      if (simPath.length === 0) return;
      const total = simPath.length;
      const idxFloat = prog * (total - 1);
      const idx = Math.min(Math.floor(idxFloat), total - 1);
      const frac = idxFloat - idx;

      const ptA = simPath[idx];
      const ptB = (idx < total - 1) ? simPath[idx + 1] : ptA;

      const curLat = ptA[0] + (ptB[0] - ptA[0]) * frac;
      const curLng = ptA[1] + (ptB[1] - ptA[1]) * frac;
      const curPt = [curLat, curLng];

      if (hachiMarker) {
        hachiMarker.setLatLng(curPt);
      }

      // Update trail
      if (hachiTrail) {
        const trailPts = simPath.slice(0, idx + 1);
        trailPts.push(curPt);
        hachiTrail.setLatLngs(trailPts);
      }

      // Camera follow
      const followCam = document.getElementById('hachiFollowCam');
      if (followCam && followCam.checked) {
        map.panTo(curPt, { animate: false });
      }

      // Direction flip
      const charBox = document.getElementById('hachiCharBox');
      if (charBox && ptB[1] !== ptA[1]) {
        if (ptB[1] < ptA[1]) {
          charBox.style.transform = 'scaleX(-1)';
        } else {
          charBox.style.transform = 'scaleX(1)';
        }
      }

      // Current spot & speech bubble
      const currentSpot = simSegments[idx];
      const slider = document.getElementById('hachiSlider');
      if (slider) slider.value = Math.round(prog * 1000);

      const statusEl = document.getElementById('hachiSimStatus');
      const bubble = document.getElementById('hachiBubble');

      if (currentSpot) {
        const spotIdx = simSpots.indexOf(currentSpot) + 1;
        const totalSpots = simSpots.length;
        const pct = Math.round(prog * 100);

        if (statusEl) {
          statusEl.textContent = `[${spotIdx}/${totalSpots}] ${currentSpot.name_ko} 통과 중 (${pct}%)`;
        }

        if (bubble) {
          if (currentSpot.name_ko.includes('건담')) {
            bubble.textContent = '우와! 건담 베이스 엄청 크다냥! 🤖';
          } else if (currentSpot.name_ko.includes('치이카와')) {
            bubble.textContent = '치이카와 빵집 도착! 냄새 좋다냥! 🍞';
          } else if (currentSpot.name_ko.includes('스카이')) {
            bubble.textContent = '시부야 스카이 전망 최고야! ✨';
          } else if (currentSpot.name_ko.includes('타워')) {
            bubble.textContent = '도쿄타워 야경 너무 낭만적이야~ 🗼';
          } else if (currentSpot.name_ko.includes('공항')) {
            bubble.textContent = '나리타 공항 도착! 여행 출발이다냥! ✈️';
          } else {
            bubble.textContent = `${currentSpot.name_ko} 구경 중이다냥! 🐾`;
          }
        }

        // Highlight sidebar card
        document.querySelectorAll('.spot-card').forEach(c => c.classList.remove('sim-active'));
        const cardEl = document.getElementById(`card_${currentSpot.id}`);
        if (cardEl) {
          cardEl.classList.add('sim-active');
          if (isSimPlaying) {
            cardEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          }
        }

        // Voice speech on spot change
        if (lastSpokenSpotId !== currentSpot.id) {
          lastSpokenSpotId = currentSpot.id;
          if (isSimPlaying) {
            speakText(`${currentSpot.name_ko} 도착!`);
          }
        }
      }
    }

    // ================= RENDER VIEW & SPOTS =================
    function renderView() {
      // Clear previous markers & polylines
      markers.forEach(m => map.removeLayer(m));
      markers = [];
      polylines.forEach(p => map.removeLayer(p));
      polylines = [];

      const spotListEl = document.getElementById('spotList');
      spotListEl.innerHTML = '';

      let itemsToShow = [];
      const daysToProcess = currentDay === 'all' ? [1, 2, 3, 4, 5] : [parseInt(currentDay)];

      daysToProcess.forEach(d => {
        const dayItems = tripData[d] || [];
        dayItems.forEach((it, idx) => {
          it._origDay = d;
          it._origIdx = idx + 1;
          it._cat = getCategoryTag(it);
          if (currentCat === 'all' || it._cat === currentCat) {
            itemsToShow.push(it);
          }
        });
      });

      // Update Day Overview Card in Sidebar
      const info = dayTitles[currentDay] || dayTitles['all'];
      document.getElementById('docBadge').textContent = info.badge;
      document.getElementById('docTitle').textContent = info.title;
      document.getElementById('docRoute').textContent = info.route;
      document.getElementById('docCount').textContent = `${itemsToShow.length} SPOTS`;
      document.getElementById('hachiSimDay').textContent = currentDay === 'all' ? 'ALL 5 DAYS' : `DAY ${currentDay}`;

      // Group for polylines by day & setup simulation spots
      const dayCoords = {};
      const latLngBounds = [];
      simSpots = [];

      itemsToShow.forEach(it => {
        // Build spot card
        const card = document.createElement('div');
        card.className = 'spot-card';
        card.id = `card_${it.id}`;

        const dayColor = dayColors[it._origDay] || '#38bdf8';
        const firstCat = (it.category && it.category.length > 0) ? it.category[0] : (it._cat === 'metro' ? '교통' : (it._cat === 'goods' ? '쇼핑' : (it._cat === 'food' ? '맛집' : '관광')));

        let memoBoxHtml = '';
        if (it.memo && it.memo.trim()) {
          memoBoxHtml = `<div class="spot-memo-box">💡 ${it.memo}</div>`;
        }

        let photoHtml = '';
        if (it.photo_url) {
          photoHtml = `<img class="spot-photo" src="${it.photo_url}" alt="${it.name_ko}" loading="lazy" onerror="this.style.display='none'">`;
        }

        card.innerHTML = `
          <div class="spot-card-top">
            <div class="spot-num-badge" style="border-color:${dayColor}; color:${dayColor}; background:${dayColor}18;">
              ${it._origIdx}
            </div>
            <div class="spot-names">
              <div class="spot-name-ko">${it.name_ko}</div>
              <div class="spot-name-en">${it.name_en || ''}</div>
            </div>
            <div class="spot-badges">
              <span class="spot-day-pill" style="color:${dayColor}; border-color:${dayColor}55; background:${dayColor}12;">Day ${it._origDay}</span>
              <span class="spot-cat-pill">${firstCat}</span>
            </div>
          </div>
          ${memoBoxHtml}
          ${photoHtml}
        `;

        card.onclick = () => {
          document.querySelectorAll('.spot-card').forEach(c => c.classList.remove('selected'));
          card.classList.add('selected');
          if (it.lat && it.lng) {
            map.flyTo([it.lat, it.lng], 16, { duration: 1.2 });
            if (it._marker) it._marker.openPopup();
          }
        };

        spotListEl.appendChild(card);

        // Add Marker
        if (it.lat && it.lng) {
          const latLng = [it.lat, it.lng];
          latLngBounds.push(latLng);
          simSpots.push(it);

          if (!dayCoords[it._origDay]) dayCoords[it._origDay] = [];
          dayCoords[it._origDay].push(latLng);

          const icon = L.divIcon({
            className: 'custom-div-icon',
            html: `<div class="custom-spot-marker" style="background:${dayColor}; width:26px; height:26px;">${it._origIdx}</div>`,
            iconSize: [26, 26],
            iconAnchor: [13, 13]
          });

          const marker = L.marker(latLng, { icon: icon }).addTo(map);
          it._marker = marker;

          let popupPhoto = it.photo_url ? `<img src="${it.photo_url}" style="width:100%; height:110px; object-fit:cover; border-radius:6px; margin-bottom:8px;" onerror="this.style.display='none'">` : '';

          marker.bindPopup(`
            ${popupPhoto}
            <div class="popup-title">${it.name_ko}</div>
            <div class="popup-sub">${it.name_en || ''} · Day ${it._origDay} #${it._origIdx}</div>
            ${it.memo ? `<div class="popup-memo">${it.memo}</div>` : ''}
            <div style="display:flex; gap:6px; margin-top:8px;">
              <a href="https://www.google.com/maps/search/?api=1&query=${it.lat},${it.lng}" target="_blank" class="popup-btn">📍 구글맵 열기</a>
              <button onclick="document.getElementById('card_${it.id}').scrollIntoView({behavior:'smooth'})" class="popup-btn" style="background:#334155; border:none; cursor:pointer;">📋 일정 보기</button>
            </div>
          `);

          marker.on('click', () => {
            document.querySelectorAll('.spot-card').forEach(c => c.classList.remove('selected'));
            card.classList.add('selected');
            card.scrollIntoView({ behavior: 'smooth', block: 'center' });
          });

          markers.push(marker);
        }
      });

      // Draw Day Route Polylines
      Object.entries(dayCoords).forEach(([d, pts]) => {
        if (pts.length > 1) {
          const color = dayColors[d] || '#38bdf8';
          const lineGlow = L.polyline(pts, {
            color: color,
            weight: 8,
            opacity: 0.35,
            smoothFactor: 1
          }).addTo(map);

          const lineCore = L.polyline(pts, {
            color: color,
            weight: 3,
            opacity: 0.95,
            dashArray: '8, 8',
            smoothFactor: 1
          }).addTo(map);

          polylines.push(lineGlow, lineCore);
        }
      });

      // Fit bounds
      if (latLngBounds.length > 0) {
        map.fitBounds(latLngBounds, { padding: [70, 70], maxZoom: 14 });
      }

      // Build & Init Hachiware simulation path for current view
      buildSimPath();
      resetHachiSim();
      initHachiware();
    }

    function filterDay(day, btn) {
      currentDay = day;
      document.querySelectorAll('.day-tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderView();
    }

    function filterCategory(cat, btn) {
      currentCat = cat;
      document.querySelectorAll('.filter-pill').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderView();
    }

    // Initial render
    window.addEventListener('DOMContentLoaded', () => {
      renderView();
    });
  </script>
</body>
</html>
